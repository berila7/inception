services:
  mariadb:
    build:
      context: ./requirements/mariadb
    volumes:
      - /home/mberila/data/mariadb:/var/lib/mysql
    networks:
      - inception
    secrets:
      - db_password
      - db_root_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    restart: always

networks:
  inception:

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt